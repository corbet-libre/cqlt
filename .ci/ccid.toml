schema = 1
project = "cqlt"

[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]
all_targets = true
toolchain = "system"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
tool_revision = "74e287fff21079a2ead49dc1e7fe792b8525482e"

[jobs.verify]
scheduler = "crow"
checks = ["rust", "verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
